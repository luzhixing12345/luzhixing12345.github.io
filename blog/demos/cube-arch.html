<div class="cube-arch-demo">
  <style>
    .cube-arch-demo {
      --ca-fg: var(--fg, #09090b);
      --ca-muted: var(--muted, #71717a);
      --ca-line: var(--line, #e4e4e7);
      --ca-soft: var(--soft, #f4f4f5);
      border: 1px solid var(--ca-line);
      border-radius: var(--radius, 8px);
      overflow: hidden;
      background: #fff;
      font-family: var(--sans, system-ui, sans-serif);
    }
    .cube-arch-demo svg { display: block; width: 100%; height: auto; }
    .cube-arch-demo text { font-size: 13px; fill: var(--ca-fg); }
    .cube-arch-demo .s { font-size: 11px; fill: var(--ca-muted); }
    .cube-arch-demo .b { font-weight: 600; }
    .cube-arch-demo .zone { fill: var(--ca-soft); stroke: var(--ca-line); }
    .cube-arch-demo .zl { font-size: 12px; font-weight: 600; fill: var(--ca-muted); }
    .cube-arch-demo .box { fill: #fff; stroke: var(--ca-fg); stroke-width: 1.2; }
    .cube-arch-demo .proc { fill: #fafafa; stroke: var(--ca-muted); stroke-dasharray: 5 4; }
    .cube-arch-demo .vm { fill: #fff7ed; stroke: #d97706; stroke-width: 1.4; }
    .cube-arch-demo .ln { fill: none; stroke: var(--ca-fg); stroke-width: 1.3; }
    .cube-arch-demo .data { fill: none; stroke: #2563eb; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .cube-arch-demo .cap {
      margin: 0; padding: 9px 14px; font-size: 12.5px; line-height: 1.6;
      color: var(--ca-muted); border-top: 1px solid var(--ca-line);
    }
  </style>

  <svg viewBox="0 0 800 480" role="img" aria-label="CubeSandbox 组件架构：控制面的 CubeAPI、CubeMaster、CubeOps、TemplateCenter、lifecycle-manager、CubeProxy、Redis、MySQL，计算节点上的 Cubelet、containerd、CubeShim、CubeHypervisor、MicroVM、CubeCoW、CubeVS、CubeEgress">
    <defs>
      <marker id="ca-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#09090b"/>
      </marker>
      <marker id="ca-ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
      </marker>
    </defs>

    <rect class="box" x="290" y="12" width="220" height="40" rx="6"/>
    <text x="400" y="37" text-anchor="middle">E2B SDK / HTTP 客户端</text>

    <rect class="zone" x="20" y="72" width="760" height="150" rx="8"/>
    <text class="zl" x="32" y="89">控制面</text>

    <rect class="box" x="40" y="96" width="140" height="44" rx="6"/>
    <text class="b" x="110" y="114" text-anchor="middle">CubeAPI</text>
    <text class="s" x="110" y="130" text-anchor="middle">Rust · E2B 兼容 REST</text>

    <rect class="box" x="230" y="96" width="150" height="44" rx="6"/>
    <text class="b" x="305" y="114" text-anchor="middle">CubeOps</text>
    <text class="s" x="305" y="130" text-anchor="middle">Go · 节点清单 · 运维</text>

    <rect class="box" x="430" y="96" width="140" height="44" rx="6"/>
    <text class="b" x="500" y="114" text-anchor="middle">TemplateCenter</text>
    <text class="s" x="500" y="130" text-anchor="middle">Go · OCI → ext4</text>

    <rect class="box" x="620" y="96" width="140" height="44" rx="6"/>
    <text class="b" x="690" y="114" text-anchor="middle">MySQL</text>
    <text class="s" x="690" y="130" text-anchor="middle">模板 · 规格 · 快照绑定</text>

    <rect class="box" x="40" y="162" width="140" height="44" rx="6"/>
    <text class="b" x="110" y="180" text-anchor="middle">lifecycle-manager</text>
    <text class="s" x="110" y="196" text-anchor="middle">Go · 空闲暂停 · 唤醒</text>

    <rect class="box" x="230" y="162" width="150" height="44" rx="6"/>
    <text class="b" x="305" y="180" text-anchor="middle">CubeMaster</text>
    <text class="s" x="305" y="196" text-anchor="middle">Go · 调度 · 编排</text>

    <rect class="box" x="430" y="162" width="140" height="44" rx="6"/>
    <text class="b" x="500" y="180" text-anchor="middle">Redis</text>
    <text class="s" x="500" y="196" text-anchor="middle">路由 · 事件流 · 锁</text>

    <rect class="box" x="620" y="162" width="140" height="44" rx="6"/>
    <text class="b" x="690" y="180" text-anchor="middle">CubeProxy</text>
    <text class="s" x="690" y="196" text-anchor="middle">OpenResty · 入站路由</text>

    <path class="ln" d="M320 52 V62 H110 V95" marker-end="url(#ca-ar)"/>
    <text class="s" x="215" y="58" text-anchor="middle">REST</text>
    <path class="ln" d="M110 140 V151 H305 V161" marker-end="url(#ca-ar)"/>
    <text class="s" x="250" y="148" text-anchor="middle">HTTP</text>
    <path class="data" d="M510 32 H772 V184 H761" marker-end="url(#ca-ar-b)"/>
    <text class="s" x="640" y="26" text-anchor="middle">访问沙箱里的服务</text>

    <rect class="zone" x="20" y="240" width="760" height="230" rx="8"/>
    <text class="zl" x="32" y="256">计算节点（每台一套）</text>

    <path class="ln" d="M305 206 V261" marker-end="url(#ca-ar)"/>
    <text class="s" x="312" y="236">gRPC</text>
    <path class="data" d="M690 206 V231 H772 V342 H761" marker-end="url(#ca-ar-b)"/>

    <rect class="box" x="40" y="262" width="470" height="40" rx="6"/>
    <text class="b" x="58" y="287">Cubelet</text>
    <text class="s" x="118" y="286">Go · 节点上的总编排：克隆盘、配网络、拉起 Shim</text>

    <rect class="box" x="40" y="330" width="150" height="40" rx="6"/>
    <text x="115" y="355" text-anchor="middle">containerd</text>
    <path class="ln" d="M115 302 V329" marker-end="url(#ca-ar)"/>

    <rect class="proc" x="230" y="322" width="270" height="138" rx="8"/>
    <text class="s" x="242" y="339">containerd-shim-cube-rs（每个沙箱一个进程）</text>
    <path class="ln" d="M190 350 H229" marker-end="url(#ca-ar)"/>
    <text class="s" x="210" y="344" text-anchor="middle">Shim v2</text>

    <rect class="box" x="245" y="346" width="240" height="38" rx="6"/>
    <text class="b" x="365" y="362" text-anchor="middle">CubeHypervisor</text>
    <text class="s" x="365" y="377" text-anchor="middle">rust-vmm · KVM · 以库的形式链入</text>
    <path class="ln" d="M365 384 V395" marker-end="url(#ca-ar)"/>

    <rect class="vm" x="245" y="396" width="240" height="56" rx="6"/>
    <text class="b" x="365" y="413" text-anchor="middle">MicroVM（独立内核）</text>
    <text class="s" x="365" y="429" text-anchor="middle">cube-agent · envd :49983 · 用户进程</text>
    <text class="s" x="365" y="444" text-anchor="middle">和 Shim 之间走 vsock</text>

    <rect class="box" x="530" y="262" width="230" height="44" rx="6"/>
    <text class="b" x="645" y="280" text-anchor="middle">CubeCoW</text>
    <text class="s" x="645" y="296" text-anchor="middle">Rust 库 · XFS reflink / S3 卷</text>

    <rect class="box" x="530" y="320" width="230" height="44" rx="6"/>
    <text class="b" x="645" y="338" text-anchor="middle">CubeVS</text>
    <text class="s" x="645" y="354" text-anchor="middle">eBPF · TAP / 网卡 / cube-dev</text>

    <rect class="box" x="530" y="378" width="230" height="44" rx="6"/>
    <text class="b" x="645" y="396" text-anchor="middle">CubeEgress</text>
    <text class="s" x="645" y="412" text-anchor="middle">OpenResty · L7 出站代理</text>

    <path class="ln" d="M510 284 H529" marker-end="url(#ca-ar)"/>
    <path class="ln" d="M520 284 V336 H529" marker-end="url(#ca-ar)"/>
    <path class="data" d="M485 430 H514 V356 H529" marker-end="url(#ca-ar-b)"/>
    <text class="s" x="490" y="446">TAP</text>
    <path class="data" d="M645 364 V377" marker-end="url(#ca-ar-b)"/>
    <text class="s" x="652" y="375">TPROXY</text>
  </svg>
  <p class="cap">黑色实线是创建沙箱的控制路径，蓝色虚线是访问沙箱和沙箱出网的数据流量。CubeMaster 还读写 Redis 和 MySQL，并从 CubeOps 拿节点清单，图里省略了这些连线。CubeCoW 和 CubeVS 都在 Cubelet 进程里被直接调用，不是独立服务。</p>
</div>

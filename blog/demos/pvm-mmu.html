<div class="pvm-mmu-demo">
  <style>
    .pvm-mmu-demo {
      --pm-fg: var(--fg, #09090b);
      --pm-muted: var(--muted, #71717a);
      --pm-line: var(--line, #e4e4e7);
      --pm-soft: var(--soft, #f4f4f5);
      --pm-hi: #2563eb;
      border: 1px solid var(--pm-line);
      border-radius: var(--radius, 8px);
      overflow: hidden;
      background: #fff;
      font-family: var(--sans, system-ui, sans-serif);
      color: var(--pm-fg);
    }
    .pvm-mmu-demo svg { display: block; width: 100%; height: auto; background: var(--pm-soft); }
    .pvm-mmu-demo text { font-size: 12.5px; fill: var(--pm-fg); }
    .pvm-mmu-demo .s { font-size: 11px; fill: var(--pm-muted); }
    .pvm-mmu-demo .m { font-family: var(--mono, ui-monospace, monospace); }
    .pvm-mmu-demo .b { font-weight: 600; }
    .pvm-mmu-demo .zone { fill: #fff; stroke: var(--pm-line); }
    .pvm-mmu-demo .zl { font-size: 12.5px; font-weight: 600; }
    .pvm-mmu-demo .addr { fill: #fff; stroke: var(--pm-fg); stroke-width: 1.2; }
    .pvm-mmu-demo .ar { fill: none; stroke: #a1a1aa; stroke-width: 1.4; }
    .pvm-mmu-demo .arh { fill: none; stroke: var(--pm-hi); stroke-width: 2; }
    .pvm-mmu-demo .br { fill: none; stroke: var(--pm-hi); stroke-width: 2; }
    .pvm-mmu-demo .hl { fill: var(--pm-hi); font-weight: 600; }
    .pvm-mmu-demo .ro { fill: #d97706; font-size: 11px; font-weight: 600; }
    .pvm-mmu-demo .note { fill: #eff6ff; stroke: none; }
    .pvm-mmu-demo .trap { fill: #fef2f2; stroke: none; }
    .pvm-mmu-demo .trapt { font-size: 11.5px; fill: #b91c1c; }
    .pvm-mmu-demo .okt { font-size: 11.5px; fill: #15803d; }
    .pvm-mmu-demo .ok { fill: #f0fdf4; stroke: none; }
    .pvm-mmu-demo .cap {
      margin: 0; padding: 10px 14px 12px; font-size: 13px; line-height: 1.7;
      border-top: 1px solid var(--pm-line);
    }
  </style>

  <svg viewBox="0 0 800 400" role="img" aria-label="两种嵌套内存虚拟化对比：嵌套 KVM 由 L0 把 EPT12 和 EPT01 合成 EPT02，L1 每改一次 EPT12 都要陷入 L0；PVM 由 L1 把 GPT2 合成影子页表 SPT12，L0 的 EPT01 不变，L2 改页表只陷入 L1">
    <defs>
      <marker id="pm-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0L10 5L0 10z" fill="#a1a1aa"/>
      </marker>
      <marker id="pm-arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
      </marker>
    </defs>

    <rect class="zone" x="14" y="14" width="380" height="372" rx="8"/>
    <text class="zl" x="30" y="38">嵌套 KVM：EPT-on-EPT</text>

    <rect class="addr" x="34" y="58" width="92" height="30" rx="15"/>
    <text class="m" x="80" y="78" text-anchor="middle">GVA₂</text>
    <rect class="addr" x="34" y="128" width="92" height="30" rx="15"/>
    <text class="m" x="80" y="148" text-anchor="middle">GPA₂</text>
    <rect class="addr" x="34" y="198" width="92" height="30" rx="15"/>
    <text class="m" x="80" y="218" text-anchor="middle">GPA₁</text>
    <rect class="addr" x="34" y="268" width="92" height="30" rx="15"/>
    <text class="m" x="80" y="288" text-anchor="middle">HPA</text>

    <path class="arh" d="M80 88 V126" marker-end="url(#pm-arh)"/>
    <text class="b m" x="94" y="106">GPT2</text>
    <text class="s" x="140" y="106">L2 内核自己维护，随便改</text>
    <path class="ar" d="M80 158 V196" marker-end="url(#pm-ar)"/>
    <text class="b m" x="94" y="176">EPT12</text>
    <text class="s" x="146" y="176">L1 维护</text>
    <text class="ro" x="196" y="176">对 L1 只读</text>
    <path class="ar" d="M80 228 V266" marker-end="url(#pm-ar)"/>
    <text class="b m" x="94" y="246">EPT01</text>
    <text class="s" x="146" y="246">L0 维护</text>

    <path class="br" d="M300 143 H320 V283 H300"/>
    <text class="hl m" x="328" y="208">EPT02</text>
    <text class="s" x="328" y="224">L0 合成</text>

    <rect class="note" x="30" y="312" width="348" height="28" rx="4"/>
    <text class="m" x="42" y="331">MMU 装载：CR3 = GPT2，EPTP = EPT02</text>
    <rect class="trap" x="30" y="346" width="348" height="28" rx="4"/>
    <text class="trapt" x="42" y="365">L1 每写一项 EPT12，都陷入 L0 去模拟</text>

    <rect class="zone" x="406" y="14" width="380" height="372" rx="8"/>
    <text class="zl" x="422" y="38">PVM：PVM-on-EPT</text>

    <rect class="addr" x="426" y="58" width="92" height="30" rx="15"/>
    <text class="m" x="472" y="78" text-anchor="middle">GVA₂</text>
    <rect class="addr" x="426" y="128" width="92" height="30" rx="15"/>
    <text class="m" x="472" y="148" text-anchor="middle">GPA₂</text>
    <rect class="addr" x="426" y="198" width="92" height="30" rx="15"/>
    <text class="m" x="472" y="218" text-anchor="middle">GPA₁</text>
    <rect class="addr" x="426" y="268" width="92" height="30" rx="15"/>
    <text class="m" x="472" y="288" text-anchor="middle">HPA</text>

    <path class="ar" d="M472 88 V126" marker-end="url(#pm-ar)"/>
    <text class="b m" x="486" y="106">GPT2</text>
    <text class="s" x="532" y="106">L2 维护</text>
    <text class="ro" x="582" y="106">对 L2 只读</text>
    <path class="ar" d="M472 158 V196" marker-end="url(#pm-ar)"/>
    <text class="b m" x="486" y="176">memslot</text>
    <text class="s" x="548" y="176">VMM 分给沙箱的内存</text>
    <path class="arh" d="M472 228 V266" marker-end="url(#pm-arh)"/>
    <text class="b m" x="486" y="246">EPT01</text>
    <text class="s" x="538" y="246">L0 维护，和普通 VM 一样</text>

    <path class="br" d="M692 73 H712 V213 H692"/>
    <text class="hl m" x="720" y="138">SPT12</text>
    <text class="s" x="720" y="154">L1 合成</text>
    <text class="s" x="720" y="170">用户、内核</text>
    <text class="s" x="720" y="186">各一套</text>

    <rect class="note" x="422" y="312" width="348" height="28" rx="4"/>
    <text class="m" x="434" y="331">MMU 装载：CR3 = SPT12，EPTP = EPT01</text>
    <rect class="ok" x="422" y="346" width="348" height="28" rx="4"/>
    <text class="okt" x="434" y="365">L2 每写一项 GPT2，只陷入 L1；L0 毫不知情</text>
  </svg>

  <p class="cap">硬件只有两级地址翻译，嵌套却有三级，总得有人把其中两级合成一张表。蓝色是 MMU 真正在用的表。嵌套 KVM 让 L0 去合成下面两级，维护代价落在最贵的 L0 身上；PVM 让 L1 用影子页表合成上面两级，L0 的那张 EPT01 从头到尾不变。</p>
</div>

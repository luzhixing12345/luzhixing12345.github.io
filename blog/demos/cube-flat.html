<div class="cube-flat-demo">
  <style>
    .cube-flat-demo {
      --cf-fg: var(--fg, #09090b);
      --cf-muted: var(--muted, #71717a);
      --cf-line: var(--line, #e4e4e7);
      --cf-soft: var(--soft, #f4f4f5);
      border: 1px solid var(--cf-line);
      border-radius: var(--radius, 8px);
      overflow: hidden;
      background: #fff;
      font-family: var(--sans, system-ui, sans-serif);
    }
    .cube-flat-demo svg { display: block; width: 100%; height: auto; }
    .cube-flat-demo text { font-size: 12px; fill: var(--cf-fg); }
    .cube-flat-demo .s { font-size: 11px; fill: var(--cf-muted); }
    .cube-flat-demo .m { font-family: var(--mono, ui-monospace, monospace); }
    .cube-flat-demo .hd { font-size: 12.5px; font-weight: 600; }
    .cube-flat-demo .zone { fill: var(--cf-soft); stroke: var(--cf-line); }
    .cube-flat-demo .box { fill: #fff; stroke: var(--cf-fg); stroke-width: 1.2; }
    .cube-flat-demo .main { fill: #fff; stroke: var(--cf-fg); stroke-width: 1.8; }
    .cube-flat-demo .gone { fill: #fff; stroke: #a1a1aa; stroke-dasharray: 4 3; }
    .cube-flat-demo .ln { fill: none; stroke: var(--cf-fg); stroke-width: 1.2; }
    .cube-flat-demo .lin { fill: none; stroke: #a1a1aa; stroke-width: 1.1; stroke-dasharray: 3 3; }
    .cube-flat-demo .cap {
      margin: 0; padding: 9px 14px; font-size: 12.5px; line-height: 1.6;
      color: var(--cf-muted); border-top: 1px solid var(--cf-line);
    }
  </style>
  <svg viewBox="0 0 800 230" role="img" aria-label="链式快照与 CubeCoW 扁平快照的对比">
    <defs>
      <marker id="cf-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#09090b"/>
      </marker>
    </defs>

    <rect class="zone" x="16" y="16" width="330" height="198" rx="8"/>
    <text class="hd" x="30" y="38">链式：每层只记差异，依赖父层</text>
    <rect class="box" x="36" y="62" width="90" height="34" rx="5"/><text x="81" y="83" text-anchor="middle" class="m">base</text>
    <rect class="box" x="146" y="62" width="80" height="34" rx="5"/><text x="186" y="83" text-anchor="middle" class="m">snap1</text>
    <rect class="gone" x="246" y="62" width="80" height="34" rx="5"/><text x="286" y="83" text-anchor="middle" class="m">snap2</text>
    <path class="ln" d="M146 79 H127" marker-end="url(#cf-ar)"/>
    <path class="ln" d="M246 79 H227" marker-end="url(#cf-ar)"/>
    <text class="s" x="36" y="126">删掉中间的 snap1，要先把它的差异合并进 snap2，</text>
    <text class="s" x="36" y="144">否则 snap2 读不全。读一个块也可能要沿链往回找。</text>
    <text class="s" x="36" y="172">箭头指向父层。</text>

    <rect class="zone" x="366" y="16" width="418" height="198" rx="8"/>
    <text class="hd" x="380" y="38">CubeCoW：同一目录里的平级文件</text>
    <text class="s m" x="380" y="60">volumes/tpl-x-rootfs/</text>

    <rect class="main" x="390" y="72" width="110" height="40" rx="5"/>
    <text x="445" y="90" text-anchor="middle" class="m">tpl-x-rootfs</text>
    <text x="445" y="104" text-anchor="middle" class="s">主文件</text>
    <rect class="box" x="520" y="72" width="80" height="40" rx="5"/>
    <text x="560" y="90" text-anchor="middle" class="m">snap-a</text>
    <text x="560" y="104" text-anchor="middle" class="s">独立映射</text>
    <rect class="box" x="620" y="72" width="80" height="40" rx="5"/>
    <text x="660" y="90" text-anchor="middle" class="m">snap-b</text>
    <text x="660" y="104" text-anchor="middle" class="s">由 snap-a 克隆</text>
    <rect class="box" x="710" y="72" width="62" height="40" rx="5"/>
    <text x="741" y="90" text-anchor="middle" class="m">…</text>

    <path class="lin" d="M560 112 C 560 140, 660 140, 660 113"/>
    <text class="s" x="610" y="150" text-anchor="middle">血缘只记在内存索引里</text>
    <text class="s" x="380" y="176">snap-b 的 origin 仍记为 tpl-x-rootfs，文件也放在这个目录下。</text>
    <text class="s" x="380" y="194">删掉 snap-a 只是 unlink 一个文件，snap-b 不受影响。</text>
  </svg>
  <p class="cap">reflink 本身允许“快照的快照”。CubeCoW 不让这种关系变成磁盘上的链：每个快照都是一个拥有完整 extent 映射的普通文件，共享关系交给 XFS 的引用计数。</p>
</div>

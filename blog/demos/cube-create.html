<div class="cube-create-demo">
  <style>
    .cube-create-demo {
      --cc-fg: var(--fg, #09090b);
      --cc-muted: var(--muted, #71717a);
      --cc-line: var(--line, #e4e4e7);
      --cc-soft: var(--soft, #f4f4f5);
      border: 1px solid var(--cc-line);
      border-radius: var(--radius, 8px);
      overflow: hidden;
      background: #fff;
      font-family: var(--sans, system-ui, sans-serif);
    }
    .cube-create-demo svg { display: block; width: 100%; height: auto; }
    .cube-create-demo text { font-size: 12px; fill: var(--cc-fg); }
    .cube-create-demo .s { font-size: 11px; fill: var(--cc-muted); }
    .cube-create-demo .head { fill: #fff; stroke: var(--cc-fg); stroke-width: 1.2; }
    .cube-create-demo .hd { font-size: 12.5px; font-weight: 600; }
    .cube-create-demo .life { stroke: #d4d4d8; stroke-dasharray: 4 4; }
    .cube-create-demo .msg { fill: none; stroke: var(--cc-fg); stroke-width: 1.2; }
    .cube-create-demo .ret { fill: none; stroke: var(--cc-muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cube-create-demo .note { fill: var(--cc-soft); stroke: var(--cc-line); }
    .cube-create-demo .vmnote { fill: #fff7ed; stroke: #fdba74; }
    .cube-create-demo .cap {
      margin: 0; padding: 9px 14px; font-size: 12.5px; line-height: 1.6;
      color: var(--cc-muted); border-top: 1px solid var(--cc-line);
    }
  </style>

  <svg viewBox="0 0 800 560" role="img" aria-label="一次创建沙箱请求的时序：SDK、CubeAPI、CubeMaster、Cubelet、CubeShim、客户机、Redis 之间的调用">
    <defs>
      <marker id="cc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#09090b"/>
      </marker>
      <marker id="cc-ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#71717a"/>
      </marker>
    </defs>

    <g>
      <line class="life" x1="55" y1="44" x2="55" y2="548"/>
      <line class="life" x1="165" y1="44" x2="165" y2="548"/>
      <line class="life" x1="280" y1="44" x2="280" y2="548"/>
      <line class="life" x1="405" y1="44" x2="405" y2="548"/>
      <line class="life" x1="535" y1="44" x2="535" y2="548"/>
      <line class="life" x1="655" y1="44" x2="655" y2="548"/>
      <line class="life" x1="755" y1="44" x2="755" y2="548"/>

      <rect class="head" x="15" y="14" width="80" height="28" rx="5"/><text class="hd" x="55" y="33" text-anchor="middle">SDK</text>
      <rect class="head" x="120" y="14" width="90" height="28" rx="5"/><text class="hd" x="165" y="33" text-anchor="middle">CubeAPI</text>
      <rect class="head" x="230" y="14" width="100" height="28" rx="5"/><text class="hd" x="280" y="33" text-anchor="middle">CubeMaster</text>
      <rect class="head" x="360" y="14" width="90" height="28" rx="5"/><text class="hd" x="405" y="33" text-anchor="middle">Cubelet</text>
      <rect class="head" x="485" y="14" width="100" height="28" rx="5"/><text class="hd" x="535" y="33" text-anchor="middle">CubeShim</text>
      <rect class="head" x="610" y="14" width="90" height="28" rx="5"/><text class="hd" x="655" y="33" text-anchor="middle">客户机</text>
      <rect class="head" x="715" y="14" width="80" height="28" rx="5"/><text class="hd" x="755" y="33" text-anchor="middle">Redis</text>
    </g>

    <path class="msg" d="M55 78 H164" marker-end="url(#cc-ar)"/>
    <text x="110" y="72" text-anchor="middle">POST /sandboxes</text>

    <path class="msg" d="M165 106 H279" marker-end="url(#cc-ar)"/>
    <text x="222" y="100" text-anchor="middle">POST /cube/sandbox</text>

    <rect class="note" x="205" y="120" width="150" height="24" rx="4"/>
    <text x="280" y="136" text-anchor="middle">过滤 → 打分 → 选节点</text>

    <path class="msg" d="M280 170 H404" marker-end="url(#cc-ar)"/>
    <text x="342" y="164" text-anchor="middle">gRPC Create</text>

    <rect class="note" x="305" y="184" width="200" height="24" rx="4"/>
    <text x="405" y="200" text-anchor="middle">① 分配 ID · 确认模板在本机</text>
    <rect class="note" x="290" y="214" width="230" height="24" rx="4"/>
    <text x="405" y="230" text-anchor="middle">② 并行：克隆 rootfs · 分 TAP · 挂卷</text>
    <rect class="note" x="325" y="244" width="160" height="24" rx="4"/>
    <text x="405" y="260" text-anchor="middle">③ 主机侧 cgroup</text>

    <path class="msg" d="M405 296 H534" marker-end="url(#cc-ar)"/>
    <text x="470" y="290" text-anchor="middle">④ 起容器</text>
    <text class="s" x="470" y="310" text-anchor="middle">经 containerd</text>

    <rect class="vmnote" x="460" y="322" width="150" height="24" rx="4"/>
    <text x="535" y="338" text-anchor="middle">mmap 内存镜像 · 接设备</text>

    <path class="msg" d="M535 370 H654" marker-end="url(#cc-ar)"/>
    <text x="595" y="364" text-anchor="middle">从快照恢复 vCPU</text>

    <path class="ret" d="M655 398 H536" marker-end="url(#cc-ar-g)"/>
    <text x="595" y="392" text-anchor="middle">vsock 就绪</text>

    <path class="msg" d="M535 426 H654" marker-end="url(#cc-ar)"/>
    <text x="595" y="420" text-anchor="middle">CreateSandbox</text>

    <path class="ret" d="M535 454 H406" marker-end="url(#cc-ar-g)"/>
    <text x="470" y="448" text-anchor="middle">任务已启动</text>

    <path class="ret" d="M405 482 H281" marker-end="url(#cc-ar-g)"/>
    <text x="342" y="476" text-anchor="middle">IP · 端口映射</text>

    <path class="msg" d="M280 510 H754" marker-end="url(#cc-ar)"/>
    <text x="580" y="504" text-anchor="middle">写代理路由 · 发生命周期事件（同时把规格写进 MySQL）</text>

    <path class="ret" d="M280 538 H166" marker-end="url(#cc-ar-g)"/>
    <path class="ret" d="M165 538 H56" marker-end="url(#cc-ar-g)"/>
    <text x="110" y="532" text-anchor="middle">201 sandbox_id</text>
  </svg>
  <p class="cap">节点内部的 ①–④ 是 Cubelet 的创建工作流：步骤之间串行，同一步里的插件并行。橙色那一步才真正碰到虚拟机，也只是把已经烤好的快照映射回来。</p>
</div>
